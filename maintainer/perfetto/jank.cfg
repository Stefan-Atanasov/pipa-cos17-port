# perfetto config for jank analysis (app open/close, shade, scroll). Record on the tablet:
#   adb push jank.cfg /data/local/tmp/ && adb shell "cat /data/local/tmp/jank.cfg | perfetto --txt -c - -o /data/misc/perfetto-traces/jank.pftrace"
# Duration 110 s (a whole heavy_mix.sh run); pull /data/misc/perfetto-traces/jank.pftrace and analyse with maintainer/perfetto/analyse.py.
duration_ms: 110000
buffers { size_kb: 393216 fill_policy: RING_BUFFER }
buffers { size_kb: 4096 fill_policy: RING_BUFFER }
data_sources {
  config {
    name: "linux.ftrace"
    ftrace_config {
      ftrace_events: "sched/sched_switch"
      ftrace_events: "sched/sched_wakeup"
      ftrace_events: "sched/sched_wakeup_new"
      ftrace_events: "sched/sched_waking"
      ftrace_events: "sched/sched_process_exit"
      ftrace_events: "sched/sched_blocked_reason"
      ftrace_events: "power/cpu_frequency"
      ftrace_events: "power/cpu_idle"
      ftrace_events: "power/suspend_resume"
      ftrace_events: "power/gpu_frequency"
      ftrace_events: "kgsl/kgsl_pwrlevel"
      ftrace_events: "task/task_newtask"
      ftrace_events: "task/task_rename"
      atrace_categories: "gfx"
      atrace_categories: "view"
      atrace_categories: "input"
      atrace_categories: "am"
      atrace_categories: "wm"
      atrace_categories: "dalvik"
      atrace_categories: "binder_driver"
      atrace_categories: "sched"
      atrace_categories: "freq"
      atrace_categories: "hal"
      atrace_apps: "*"
      buffer_size_kb: 16384
      drain_period_ms: 250
    }
  }
}
data_sources { config { name: "android.surfaceflinger.frametimeline" } }
data_sources { config { name: "linux.process_stats" target_buffer: 1 process_stats_config { scan_all_processes_on_start: true } } }

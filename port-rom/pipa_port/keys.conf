# 小米笔两个笔身按键的映射
#   pageup   = 截图键（副键，离笔尖远）
#   pagedown = 速记键（主键，靠笔尖）
#
# 写法：数字=Android keycode | none=不动作 | app:包名/Activity | cmd:shell命令
#   4=返回  120=截屏(SYSRQ)  3=Home  187=最近任务  26=电源
#
# 1.13 (stefan): 速记键默认 none —— 它是 STYLUS_BUTTON_PRIMARY，Android 会把它并入笔的触摸事件
# （settings secure stylus_buttons_enabled=1），Xodo 等应用用它当橡皮擦；全局动作会盖掉应用里的功能。
# 现在：截图键=截屏；速记键=不动作（交给应用）。
# 想把速记键改成"打开便签速记/涂鸦"，把下面那行换成：
#   pagedown=app:com.coloros.note/com.nearme.note.paint.QuickPaintActivity
pageup=120
pagedown=none
